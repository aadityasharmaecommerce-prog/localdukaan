<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LocalDukaan Admin</title><style>body{font-family:system-ui;background:#F6FAF7;margin:0;padding:16px}h1{color:#15803D}table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}th,td{padding:10px;text-align:left;border-bottom:1px solid #E4EFE8;font-size:14px}th{background:#EFF7F1;color:#15803D}.live{color:#15803D;font-weight:700}.off{color:#B45309;font-weight:700}button{padding:6px 10px;border:0;border-radius:8px;cursor:pointer;font-weight:600;margin:2px}.pub{background:#16A34A;color:#fff}.unpub{background:#F59E0B;color:#fff}.sus{background:#DC2626;color:#fff}.act{background:#2563EB;color:#fff}</style></head><body><h1>🏪 LocalDukaan Admin</h1><p>Shop par Live/Pause/Suspend ka control. <a href="?token=ldk-admin-1789915041-x9K2mQ7vR4" id="rl">Refresh</a></p><div id="out">Loading…</div><script>const T="ldk-admin-1789915041-x9K2mQ7vR4";async function load(){const r=await fetch('/v1/admin/shops',{headers:{'x-admin-token':T}});const d=await r.json();if(!r.ok){document.getElementById('out').textContent=d.error?.message??'Error';return}const rows=d.items.map(s=>'<tr><td>'+s.name+'</td><td>'+s.owner_name+'<br><small>'+ (s.owner_phone??'') +'</small></td><td>'+s.city+'</td><td>'+s.product_count+'</td><td class="'+(s.is_published?'live':'off')+'">'+(s.is_published?'LIVE':'NOT LIVE')+' / '+s.status+'</td><td>'+btns(s)+'</td></tr>').join('');document.getElementById('out').innerHTML='<table><tr><th>Shop</th><th>Owner</th><th>City</th><th>Products</th><th>Status</th><th>Actions</th></tr>'+rows+'</table>'}function btns(s){let h='';h+=s.is_published?'<button class=unpub onclick="act(''+s.id+'','publish',false)">Pause</button>':'<button class=pub onclick="act(''+s.id+'','publish',true)">Live karo</button>';h+=s.status==='SUSPENDED'?'<button class=act onclick="act(''+s.id+'','status','ACTIVE')">Un-suspend</button>':'<button class=sus onclick="act(''+s.id+'','status','SUSPENDED')">Suspend</button>';return h}async function act(id,k,v){const b=k==='publish'?{publish:v}:{status:v};const r=await fetch('/v1/admin/shops/'+id,{method:'POST',headers:{'x-admin-token':T,'content-type':'application/json'},body:JSON.stringify(b)});if(!r.ok)alert((await r.json()).error?.message);load()}load();setInterval(load,15000)</script></body></html>
